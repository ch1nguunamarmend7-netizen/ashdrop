# Every hour, rebuild the commit the live site says it runs and compare every file byte for byte.
# If ashdrop.cc ever serves anything that is not this public code, this check turns red,
# publicly, on the repository's Actions tab.
name: Verify live site

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  SITE: https://ashdrop.cc

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Which commit does the site say it runs?
        id: live
        run: |
          code=$(curl -sS -o "$RUNNER_TEMP/live.json" -w '%{http_code}' -A "ashdrop-verify (+https://github.com/${{ github.repository }})" "$SITE/build.json") || true
          if ! commit=$(python3 -c 'import json; print(json.load(open(__import__("os").environ["RUNNER_TEMP"] + "/live.json"))["commit"])' 2>/dev/null); then
            echo "::error::Could not read $SITE/build.json (HTTP $code). The first lines of what came back:"
            head -c 600 "$RUNNER_TEMP/live.json"; echo
            if grep -qi "challenge\|cf-chl\|just a moment" "$RUNNER_TEMP/live.json"; then
              echo "::error::Cloudflare showed a bot challenge. Turn off Bot Fight Mode (Security > Bots) so this check can read the site."
            fi
            exit 1
          fi
          echo "Live site reports commit $commit"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Check out that commit (fails if it is not public)
        run: git checkout --quiet "${{ steps.live.outputs.commit }}"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build it ourselves
        run: npm ci && npm run build
        env:
          GITHUB_SHA: ${{ steps.live.outputs.commit }}

      - name: Compare with the live site
        run: node scripts/verify.mjs "$SITE"
